name: PR Verify

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pr-verify-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    governance:
        name: Governance
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install formatting dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify Prettier formatting
              run: pnpm format:check

            - name: Verify repository structure
              shell: bash
              run: |
                  set -euo pipefail

                  required_files=(
                    AGENTS.md
                    docs/00-governance/COMMIT-RULES.md
                    docs/00-governance/PR-RULES.md
                    README.md
                    README_zh-CN.md
                    LICENSE
                    .github/pull_request_template.md
                    skills/dsh-plugin-development/SKILL.md
                    skills/dsh-plugin-development/agents/openai.yaml
                    skills/dsh-plugin-development/references/plugin-development-routing.md
                    skills/dsh-plugin-development/maintenance/source-map.md
                    skills/dsh-plugin-development/maintenance/skill-maintenance.md
                  )

                  for required_file in "${required_files[@]}"; do
                    test -s "$required_file"
                  done

            - name: Verify pull request diff formatting
              if: github.event_name == 'pull_request'
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: git diff --check "$BASE_SHA...$HEAD_SHA"

            - name: Verify repository formatting
              if: github.event_name == 'workflow_dispatch'
              run: git diff --check HEAD^

    skill-integrity:
        name: Skill Integrity
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Verify Skill frontmatter
              shell: bash
              run: |
                  set -euo pipefail

                  skill=skills/dsh-plugin-development/SKILL.md
                  test "$(sed -n '1p' "$skill")" = '---'
                  sed -n '2,/^---$/p' "$skill" | grep -Eq '^name: dsh-plugin-development$'
                  sed -n '2,/^---$/p' "$skill" | grep -Eq '^description: .+'

            - name: Verify Skill metadata
              shell: bash
              run: |
                  set -euo pipefail

                  metadata=skills/dsh-plugin-development/agents/openai.yaml
                  grep -Eq '^interface:$' "$metadata"
                  grep -Eq '^    display_name: .+' "$metadata"
                  grep -Eq '^    short_description: .+' "$metadata"
                  grep -Eq '^    default_prompt: .+' "$metadata"

            - name: Verify pinned baseline consistency
              shell: bash
              run: |
                  set -euo pipefail

                  files=(
                    README.md
                    README_zh-CN.md
                    AGENTS.md
                    skills/dsh-plugin-development/SKILL.md
                    skills/dsh-plugin-development/maintenance/source-map.md
                    skills/dsh-plugin-development/maintenance/skill-maintenance.md
                  )

                  for file in "${files[@]}"; do
                    grep -Fq 'dsh-v0.1.2-rc.1' "$file"
                  done

            - name: Verify offline Skill boundary
              shell: bash
              run: |
                  set -euo pipefail

                  if grep -RInE 'https?://' skills/dsh-plugin-development; then
                    echo 'HTTP(S) URL found inside the offline Skill directory.' >&2
                    exit 1
                  fi

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Verify Markdown links, anchors and JSON fences
              run: python3 scripts/validate_skill.py

            - name: Test validation failure cases
              run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

            - name: Test DSH Skill creation workflow
              run: node --test .agents/skills/create-dsh-skill/tests/*.test.mjs
