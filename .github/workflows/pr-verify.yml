name: PR Verify

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pr-verify-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    governance:
        name: Governance
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install formatting dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify Prettier formatting
              run: pnpm format:check

            - name: Verify repository structure
              shell: bash
              run: |
                  set -euo pipefail

                  required_files=(
                    AGENTS.md
                    docs/00-governance/COMMIT-RULES.md
                    docs/00-governance/PR-RULES.md
                    README.md
                    README_zh-CN.md
                    LICENSE
                    .github/pull_request_template.md
                    .agents/skills/create-dsh-skill/SKILL.md
                    .agents/skills/create-dsh-skill/agents/openai.yaml
                    .agents/skills/create-dsh-skill/references/entrypoint-scope.md
                    .agents/skills/create-dsh-skill/references/reference-template.md
                    .agents/skills/create-dsh-skill/references/skill-source-contract.md
                    .agents/skills/create-dsh-skill/references/output-contract.md
                    .agents/skills/review-dsh-skill/SKILL.md
                    .agents/skills/review-dsh-skill/agents/openai.yaml
                    .agents/skills/review-dsh-skill/references/review-method.md
                  )

                  for required_file in "${required_files[@]}"; do
                    test -s "$required_file"
                  done

            - name: Verify pull request diff formatting
              if: github.event_name == 'pull_request'
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: git diff --check "$BASE_SHA...$HEAD_SHA"

            - name: Verify repository formatting
              if: github.event_name == 'workflow_dispatch'
              run: git diff --check HEAD^

    skill-integrity:
        name: Skill Integrity
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install creator test dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify Skill frontmatter
              shell: bash
              run: |
                  set -euo pipefail

                  skill=.agents/skills/create-dsh-skill/SKILL.md
                  test "$(sed -n '1p' "$skill")" = '---'
                  sed -n '2,/^---$/p' "$skill" | grep -Eq '^name: create-dsh-skill$'
                  sed -n '2,/^---$/p' "$skill" | grep -Eq '^description: .+'

                  skill=.agents/skills/review-dsh-skill/SKILL.md
                  test "$(sed -n '1p' "$skill")" = '---'
                  sed -n '2,/^---$/p' "$skill" | grep -Eq '^name: review-dsh-skill$'
                  sed -n '2,/^---$/p' "$skill" | grep -Eq '^description: .+'

                  if test -f skills/dsh-plugin-development/SKILL.md; then
                    skill=skills/dsh-plugin-development/SKILL.md
                    test "$(sed -n '1p' "$skill")" = '---'
                    sed -n '2,/^---$/p' "$skill" | grep -Eq '^name: dsh-plugin-development$'
                    sed -n '2,/^---$/p' "$skill" | grep -Eq '^description: .+'
                  fi

            - name: Verify Skill metadata
              shell: bash
              run: |
                  set -euo pipefail

                  creator_metadata=.agents/skills/create-dsh-skill/agents/openai.yaml
                  grep -Eq '^policy:$' "$creator_metadata"
                  grep -Eq '^    allow_implicit_invocation: false$' "$creator_metadata"

                  review_metadata=.agents/skills/review-dsh-skill/agents/openai.yaml
                  grep -Eq '^policy:$' "$review_metadata"
                  grep -Eq '^    allow_implicit_invocation: false$' "$review_metadata"

                  if test -f skills/dsh-plugin-development/SKILL.md; then
                    metadata=skills/dsh-plugin-development/agents/openai.yaml
                    grep -Eq '^interface:$' "$metadata"
                    grep -Eq '^    display_name: .+' "$metadata"
                    grep -Eq '^    short_description: .+' "$metadata"
                    grep -Eq '^    default_prompt: .+' "$metadata"
                  fi

            - name: Verify generated Skill version identity when present
              shell: bash
              run: |
                  set -euo pipefail
                  skill=skills/dsh-plugin-development/SKILL.md
                  if test -f "$skill"; then
                    source_map=skills/dsh-plugin-development/maintenance/source-map.md
                    test -s "$source_map"
                    package_version=$(grep -Eo '@deepseek-ai/dsh-agent@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' "$source_map" | head -n 1)
                    test -n "$package_version"
                    grep -Fq "$package_version" "$skill"
                  fi

            - name: Verify repository Markdown links, anchors and JSON fences
              run: node scripts/validate_skill.mjs

            - name: Verify generated Skill links, JSON and offline boundary when present
              shell: bash
              run: |
                  set -euo pipefail
                  if test -f skills/dsh-plugin-development/SKILL.md; then
                    node scripts/validate_skill.mjs --skill skills/dsh-plugin-development
                  fi

            - name: Test validation failure cases
              run: node --test scripts/*.test.mjs

            - name: Test DSH Skill creation workflow
              run: node --test .agents/skills/create-dsh-skill/tests/*.test.mjs
